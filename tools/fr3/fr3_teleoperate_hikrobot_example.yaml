robot:
  type: franka_research3
  robot_ip: 192.168.1.206
  gripper_backend: franka_hand
  allow_mock_gripper: false
  urdf_path: /workspace/src/lerobot/robots/franka_research3/assets/franka_fr3/fr3_franka_hand.urdf
  target_frame_name: fr3_hand_tcp
  max_target_delta_pos: [0.001, 0.001, 0.001]
  max_target_delta_rot: [0.01, 0.01, 0.01]
  cameras:
    ee:
      type: hikrobot
      serial: "DA5404760"
      width: 1280
      height: 720
      fps: 30
      transport_layer: gige
      color_mode: bgr
      warmup_s: 2
      exposure_us: 10000
      gain_db: 12
      gamma: 1.3
      white_balance_auto: continuous
      lock_white_balance_after_warmup: true
      timeout_ms: 1000
    side:
      type: hikrobot
      serial: "DA5404761"
      width: 1280
      height: 720
      fps: 30
      transport_layer: gige
      color_mode: bgr
      warmup_s: 2
      exposure_us: 10000
      gain_db: 12
      gamma: 1.3
      white_balance_auto: continuous
      lock_white_balance_after_warmup: true
      timeout_ms: 1000

teleop:
  type: spacemouse
  device_id: 0
  tool_mode: binary
  incremental_step: 0.05
  move_time: 0.02
  enable_rotation: true
  translation_scale: 0.000615
  rotation_scale: 0.000648
  scale_wx: 0.0
  scale_wy: 0.0

fps: 60
teleop_time_s: 300
display_data: false
display_compressed_images: false
