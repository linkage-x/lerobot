robot:
  cameras:
    cam_2:
      type: hikrobot
      serial: "DA9342685"
      width: 1280
      height: 720
      fps: 30
      transport_layer: gige
      color_mode: bgr
      warmup_s: 2
      exposure_us: 3000
      gain_db:
      gamma: 1.3
      white_balance_auto: continuous
      lock_white_balance_after_warmup: false
      timeout_ms: 1000
    cam_3:
      type: hikrobot
      serial: "DA9342471"
      width: 1280
      height: 720
      fps: 30
      transport_layer: gige
      color_mode: bgr
      warmup_s: 2
      exposure_us: 3000
      gain_db:
      gamma: 1.3
      white_balance_auto: continuous
      lock_white_balance_after_warmup: false
      timeout_ms: 1000
    pika_right_opencv:
      type: opencv
      index_or_path: /dev/v4l/by-id/usb-DECXIN_CAMERA_DECXIN_CAMERA_01.00.00-video-index0
      width: 640
      height: 480
      fps: 30
      color_mode: rgb
      warmup_s: 1
      fourcc: MJPG
      
