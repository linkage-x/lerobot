  gripper_backend: franka_hand
  allow_mock_gripper: false
  urdf_path: /workspace/src/lerobot/robots/franka_research3/assets/franka_fr3/fr3_franka_hand.urdf
  target_frame_name: fr3_hand_tcp
  max_target_delta_pos: [0.001, 0.001, 0.001]
  max_target_delta_rot: [0.01, 0.01, 0.01]
  cameras:
    cam_0:
      type: hikrobot
      serial: "DA9342471"
      width: 1280
      height: 720
      fps: 30
