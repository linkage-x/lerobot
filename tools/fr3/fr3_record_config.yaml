robot:
  type: franka_research3
  robot_ip: 192.168.1.206
  gripper_port: /dev/serial/by-path/pci-0000:00:14.0-usb-0:9.1.4:1.0-port0
  allow_mock_gripper: false
  urdf_path: /lerobot/src/lerobot/robots/franka_research3/assets/franka_fr3/fr3_pika_gripper.urdf
  # The finger working-point midpoint. `pika_task_tcp` sits 410.85 mm behind this frame (a literal
  # carried over from the free-flying quest3 wrist model, see test_fr3_tool_frame_geometry.py),
  # which makes it a lever: `send_action` composes rotation about the *target frame origin*
  # (franka_research3.py: desired_pose[:3,:3] = reference @ delta_rot), so a 45 deg wrist command
  # swept the fingertips through a 314 mm arc -- which is why the roll/pitch teleop axes below used
  # to be pinned to 0. Recording against the tool point makes rotation a rotation.
  #
  # Datasets recorded before this line changed are anchored to pika_task_tcp and are NOT replayable
  # against this config. Convert them (p_ee = p_tcp + R(quat) @ [-0.366842, 0, 0.185]) or replay
  # them with an overlay that names the old frame. See tools/fr3/WORKSTATION_RECORDING.md.
  target_frame_name: pika_gripper_ee
  # Must match the `home` keyframe in
  # src/lerobot/robots/franka_research3/assets/franka_fr3/fr3_pika_gripper.xml.
  # The workstation recording workspace is anchored to this pose; do not use the DAS/SDK start
  # pose as a substitute.
  start_joint_positions: [0, -0.785, 0, -2.355, 0, 1.57079, 0.785]
  max_target_delta_pos: [0.001, 0.001, 0.001]
  max_target_delta_rot: [0.01, 0.01, 0.01]
  # A fence on the commanded tool point, in the robot base frame -- not a description of the task.
  # Derived from the workstation table in fr3_pika_gripper_scene.xml, which sits at base-frame
  # x [0.18, 0.86], y [-0.46, 0.46] with its top at exactly z = 0:
  #   z >= 0      the fingertips are never commanded into the tabletop
  #   x, y        the table's own footprint, trimmed to 0.70/0.45 so the reachable part of the box
  #               dominates (FR3 reach is 855 mm from the base; the far corners of any box that
  #               covers this table are outside it)
  #
  # This box is NOT the reachable envelope, and where they disagree the arm stops without saying
  # so. Unreachable targets do not raise: HirolLMKinematicsDriver clips its step to the URDF joint
  # limits (backends.py) and returns the joints it already had, so the arm is commanded to hold
  # position and FR3 -- never having seen an illegal command -- stays green. Measured on this rig,
  # walking the tool point in -x from the home pose with the home orientation held:
  #   z >= 0.25   reaches x = 0.18, the fence is the limit
  #   z = 0.20    stops at x = 0.2183   } fr3_joint4 pinned at its -3.0421 rad lower limit. The
  #   z = 0.12    stops at x = 0.2818   } Pika tool is 411 mm long, so holding the fingertips both
  #   z = 0.06    stops at x = 0.2988   } low and near the base folds the elbow past its stop.
  # Home is x = 0.3086, so at grasp height there is ~10 mm of -x travel, not the 129 mm this box
  # advertises. Pitching the wrist ~20 deg (fingers down-and-back) releases j4 and restores the
  # full range -- teleop.scale_wy below is currently 0.0, which is what takes that escape away.
  # See test_the_home_pose_can_travel_at_grasp_height in test_fr3_recording_workspace_contract.py.
  #
  # The 11.6k recorded pick-and-place frames re-expressed at the tool point span
  # x [0.264, 0.464], y [-0.355, 0.122], z [0.028, 0.397], so the whole existing task fits inside
  # with margin. Widen it here if a new task needs more; do not silently rely on the dataclass
  # default, which was written for pika_task_tcp and is meaningless at the tool point. Widening
  # x_min buys nothing on its own -- at grasp height the kinematics bind ~120 mm before this box
  # does, and dropping below 0.18 puts the fence off the near edge of the table.
  workspace_min: [0.18, -0.45, 0.0]
  workspace_max: [0.70, 0.45, 0.70]
  camera_max_age_ms: 100
  # See config_franka_research3.py: 20 rather than 15 is set by the sim twin's EGL renderer
  # (measured straggling 19 ms), and kept identical here so one envelope covers both rigs.
  camera_max_skew_ms: 20
  # Do not kill the recorder on a single cross-camera jitter frame. Capture timestamps are
  # recorded and the per-episode SYNC audit / QC gate decides whether the take is usable.
  camera_skew_hard_fail: false
  cameras:
    # Sensor rate, deliberately above dataset.fps: an image is only as fresh as the sensor's
    # frame period allows, so 60 Hz halves how stale a recorded frame is (measured 42-45 ms
    # behind the arm read at 30 Hz). The dataset is still written at dataset.fps.
    #
    # exposure_us/gain are pinned because `fps` alone does not buy the rate. A sensor cannot
    # emit a frame faster than it exposes one, so exposure is a frame-rate control whether or
    # not it is treated as one, and these controls live on the *device*: on 2026-08-19 both
    # cameras had been left on manual exposure (36.5 ms on ee, 42.3 ms on side, each longer
    # than the 16.7 ms period), and every recording inherited it. The profiles still negotiated
    # 640x480@60 and the frame counters showed no drops -- the sensors simply ran at 15.0 and
    # 23.6 fps, which reached the dataset as 75%/65% duplicated images and a failed SYNC audit.
    #
    # 15 ms sits just under the 16.7 ms period, so 60 fps holds no matter how dark the room
    # gets. The gains restore the brightness auto exposure had chosen for the workstation scene
    # (mean intensity 93 on ee, 109 on side): measured at 15 ms, ee reads 73 at gain 49 and 105
    # at gain 82, side reads 96 at gain 110 and 105 at gain 128. A fixed exposure also keeps
    # motion blur and image statistics constant across a take, which auto exposure does not.
    #
    # Verified through the recorder's own config path: ee holds 60.0 fps at mean 113 (1.9% of
    # pixels clipped, 2.5 LSB of temporal noise), side 59.7 fps at mean 121 (0.5% clipped,
    # 3.0 LSB).
    #
    # side is at its gain ceiling (128), so it has no headroom left for a darker room: add
    # light rather than lengthen the exposure here, since anything past 16.7 ms puts the rate
    # back where it started (`connect` now refuses that instead of under-delivering quietly).
    # Re-measure with tools/fr3/fr3_camera_delivery_bench.py when the lighting changes -- a
    # pinned exposure buys a constant rate, and constant motion blur, by giving up the
    # brightness tracking auto exposure did for free.
    ee:
      type: intelrealsense
      serial_number_or_name: "315122271876"
      width: 640
      height: 480
      fps: 60
      exposure_us: 15000
      gain: 70
    side:
      type: intelrealsense
      serial_number_or_name: "243122071795"
      width: 640
      height: 480
      fps: 60
      exposure_us: 15000
      gain: 128

teleop:
  type: spacemouse
  device_id: 0
  tool_mode: incremental
  incremental_step: 0.05
  move_time: 0.02
  enable_rotation: true
  translation_scale: 0.000615
  # 0.000648 rad/tick at control_fps 200 is 7.4 deg/s on yaw at full deflection -- a deliberately
  # slow starting point. (Yaw lands 7% under that: the teleoperator scales a global gain by
  # ROTATION_AXIS_CALIBRATION, and TRANSLATION_AXIS_CALIBRATION takes z down to 59%. An explicitly
  # set axis skips that factor.) Tune live from Teleoperation -> SpaceMouse 6D Gains and write the
  # value you settle on back here.
  rotation_scale: 0.000648
  # Roll and pitch are locked off, so the wrist keeps the orientation it starts an episode in and
  # the SpaceMouse drives x/y/z plus yaw. 0.0 is not the same as leaving these blank: blank means
  # "follow rotation_scale", 0.0 disables the axis outright. Blank them here to hand roll and pitch
  # back.
  scale_wx: 0.0
  scale_wy: 0.0

dataset:
  # Names the rig and how it is driven, nothing else. The task belongs to the episode
  # (`single_task` below, and the Task Library overlays both name and task per task), and the
  # action contract is not a property of a recording at all: capture always stores absolute EE
  # and delta views are derived later, so an `ee2ee` in the name labelled these files as
  # something they never were.
  #
  # This is the name of a *series*, not of one dataset. The recorder appends `_<YYYYmmdd_HHMMSS>`
  # so each session lands in its own root -- change a camera rate, a gripper or the lighting and
  # the takes stay separable, which nothing in the schema would otherwise let you do.
  repo_id: hph/fr3_spacemouse
  single_task: Pick and place
  root: /lerobot/outputs/datasets/fr3_spacemouse
  fps: 60
  num_episodes: 20
  episode_time_s: 20
  reset_time_s: 0
  video: true
  streaming_encoding: true
  vcodec: h264
  encoder_threads: 2
  push_to_hub: false

control_fps: 200
auto_move_to_start_after_episode: true
move_to_start_after_last_episode: true
confirm_next_episode_after_reset: true
display_data: false
play_sounds: false
resume: false
