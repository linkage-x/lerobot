robot:
  type: franka_research3
  robot_ip: 192.168.1.100
  gripper_backend: franka_hand
  allow_mock_gripper: false
  urdf_path: /workspace/src/lerobot/robots/franka_research3/assets/franka_fr3/fr3_franka_hand.urdf
  target_frame_name: fr3_hand_tcp
  max_target_delta_pos: [0.001, 0.001, 0.001]
  max_target_delta_rot: [0.01, 0.01, 0.01]
  cameras:
    ee:
      type: hikrobot
      serial: "DA9342611"
      width: 1280
      height: 720
      fps: 30
      transport_layer: gige
      color_mode: bgr
      warmup_s: 2
      exposure_us: 10000
      gain_db: 12
      gamma: 1.3
      white_balance_auto: continuous
      lock_white_balance_after_warmup: true
      timeout_ms: 1000
    side:
      type: hikrobot
      serial: "DA9342673"
      width: 1280
      height: 720
      fps: 30
      transport_layer: gige
      color_mode: bgr
      warmup_s: 2
      exposure_us: 10000
      gain_db: 12
      gamma: 1.3
      white_balance_auto: continuous
      lock_white_balance_after_warmup: true
      timeout_ms: 1000

teleop:
  type: spacemouse
  device_id: 0
  tool_mode: binary
  incremental_step: 0.05
  move_time: 0.02
  enable_rotation: true
  translation_scale: 0.001615
  rotation_scale: 0.001648
  scale_wx: 0.0
  scale_wy: 0.0

dataset:
  repo_id: hirol/fr3_hikrobot_pick_place_v1
  single_task: Pick and place
  root: /workspace/outputs/datasets/fr3_hikrobot_pick_place_v1
  fps: 30
  num_episodes: 20
  episode_time_s: 17
  reset_time_s: 0
  video: true
  streaming_encoding: true
  vcodec: h264
  encoder_threads: 2
  push_to_hub: false

control_fps: 200
auto_move_to_start_after_episode: true
move_to_start_after_last_episode: true
confirm_next_episode_after_reset: true
display_data: false
play_sounds: false
resume: false
