dataset:
  repo_id: local/handheld_multimodal_v1
  single_task: Handheld multimodal capture
  root: outputs/datasets/handheld_multimodal_v1
  fps: 30
  # 0 means unlimited saved episodes; press Esc while recording to stop the session.
  num_episodes: 0
  episode_time_s: 10
  video: true
  streaming_encoding: true
  vcodec: h264
  encoder_threads: 2
  capture_queue_size: 16
  push_to_hub: false

display_data: true
display_ip:
display_port:
rerun_save_path:
play_sounds: false
resume: false
