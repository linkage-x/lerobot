sensors:
  max_read_age_ms: 500
  soft_sync:
    enabled: false
    tolerance_ms: 20.0
    wait_timeout_ms: 150.0
    poll_interval_ms: 1.0
    buffer_duration_s: 0.25
  cameras:
    # 8-channel Hikrobot setup.
    # Mapping: cam_0..cam_7 <-> hk_01..hk_08
    cam_0:
      type: hikrobot
      serial: "DA9342700"
      width: 1280
      height: 720
      fps: 30
      transport_layer: gige
      color_mode: bgr
      warmup_s: 2
      exposure_us: 3000
      gain_db: null
      white_balance_auto: continuous
      lock_white_balance_after_warmup: false
      timeout_ms: 1000
