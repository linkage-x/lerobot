# 11-channel GMSL2 (SG2-AR0234C-G2F) capture on a Jetson Thor through the
# SG16A-AGTH-G3Y-A1 adapter. All cameras are SLAVE-triggered; the Jetson PWM
# (pwmchip4/pwm0) is the master sync source at 60 Hz -- see
# tools/gmsl2/setup_sync.sh.
#
# AR0234 + this board's dtbo is hard-coded to 1920x1080 @ 60 fps (see
# dtb/SG2_AR0234C_G2F/...overlay.dtbo: min/max/default_framerate=60000000,
# framerate_factor=1000000).

sensors:
  max_read_age_ms: 250
  soft_sync:
    # Hardware sync is active; soft sync is disabled. The recorder still aligns
    # samples by writing the per-camera capture timestamp on every step.
    enabled: false
    tolerance_ms: 20.0
    wait_timeout_ms: 150.0
    poll_interval_ms: 1.0
    buffer_duration_s: 0.25
  cameras:
    cam_00:
      type: gmsl2
      sensor_id: 0
      pipeline: v4l2_bayer
      bayer_format: grbg10le
      sensor_mode: 0
      width: 1920
      height: 1080
      fps: 60
      color_mode: bgr
      sync_role: slave
      trig_pin: 0x00020007
      apply_sync_at_connect: true
      # Driver defaults are exposure=14 (effectively black) and gain=100. Set
      # reasonable values for typical indoor lighting; tune per scene.
      exposure_us: 15000
      gain: 300
      warmup_s: 2
      timeout_ms: 5000
    cam_01:
      type: gmsl2
      sensor_id: 1
      pipeline: v4l2_bayer
      bayer_format: grbg10le
      sensor_mode: 0
      width: 1920
