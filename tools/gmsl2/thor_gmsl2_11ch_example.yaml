dataset:
  repo_id: local/thor_gmsl2_11ch_v1
  single_task: Thor GMSL2 11-camera hardware-synced capture
  root: outputs/datasets/thor_gmsl2_11ch_v1
  # AR0234 dtbo is locked to 60 fps and the recorder writes one row per tick.
  # Lower this together with the PWM frequency (e.g. --fps 30) if disk I/O is tight.
  fps: 60
  num_episodes: 0
  episode_time_s: 10
  video: true
  streaming_encoding: true
  vcodec: h264
  encoder_threads: 2
  capture_queue_size: 16
  push_to_hub: false

display_data: true
display_ip:
display_port:
rerun_save_path:
play_sounds: false
resume: false
