# Thor + SG16A-AGTH-G3Y-A1 + 11 x SG2-AR0234C-G2F GMSL2 cameras + BOX 采集板
# (gripper, IMU, trigger, six-d force, two Paxini touch pads).
#
# The recording path runs entirely inside GStreamer:
#
#     nvarguscamerasrc --(ISP, AE/AWB/CCM via camera_overrides.isp)--> NV12
#         --(nvv4l2h265enc)--> H.265 elementary stream --(matroskamux)--> .mkv
#
# Python's job is to (a) decide which sensor-ids to record, (b) start/stop the
# GStreamer pipelines around each episode, (c) talk UDP to the BOX 采集板 MCU
# via the vendored `box_sdk` wheel and snapshot its sensors into the episode
# metadata, and (d) write a metadata sidecar with hardware-sync info +
# capture timestamps. The frame pixels never enter the Python process.
#
# AR0234 + this board's dtbo is hard-locked to 1920x1080 @ 60 fps
# (min/max/default_framerate = 60000000, framerate_factor = 1000000 in
# dtb/SG2_AR0234C_G2F/...overlay.dtbo).

# `recorder.script` is what the data-collection GUI's gateway spawns when
# the operator presses Connect. Default points at the Thor orchestrator
# below; override here if you're integrating a different recorder.
recorder:
  script: tools/thor/gmsl2/thor_record.py

sensors:
  cameras:
    # `detect_all: true` runs `tools/thor/gmsl2/check_max96726_locks.sh` at
    # session start and uses every sid the MAX96726 reports as locked. The
    # recorder additionally probes each locked sid through nvarguscamerasrc
    # and drops any that fail to open. Override with `sensor_ids: [0, 4, ...]`
    # to pin a specific subset.
    detect_all: true
    sensor_ids: []        # only used when detect_all is false
    name_prefix: "cam"    # produces cam_00, cam_01, ... in the dataset
    spawn_stagger_s: 1.0  # concurrent nvarguscamerasrc inits race on NVMM buffers; 1.0s is verified stable for 11/11 cameras; 0.5s causes NvBufSurfaceFromFd failures on 6/11 cameras
    stop_on_stream_exit: true  # set false/--ignore-stream-exit for diagnostics only

    # Per-camera capture/encoding defaults. nvarguscamerasrc handles ISP +
    # AE/AWB before the encoder sees the data. The hardware H.265 encoder
    # writes a complete MKV per camera per episode.
    defaults:
      pipeline: argus          # 'argus' = nvarguscamerasrc + ISP
      sensor_mode: 0
      width: 1920
      height: 1080
      fps: 60                  # must match the AR0234 dtbo (60 only)
      # AR0234 sensor controls applied via v4l2-ctl before recording.
      # Defaults match the user's verified-good state on this rig; set to 0
      # to leave nvargus's auto-exposure / auto-gain in charge.
      exposure_us: 9999
      gain: 320
      # Hardware encoder configuration -- consumed by nvv4l2h265enc.
      codec: h265
      bitrate_kbps: 20000
      iframe_interval: 60      # one keyframe per second @60 fps
      preset_level: 1          # 1=UltraFastPreset, 4=SlowPreset (NV preset enum)
      control_rate: 1          # 1 = constant-bitrate, 0 = variable
      profile: main            # h265: main / main10 ; h264: high / main / baseline
      container: mkv           # mkv or mp4 (matroskamux / qtmux)

  hardware_sync:
    # Hardware-sync DISABLED by default. With `enabled: false` the recorder
    # skips `sudo sh sdk/pwm.sh` and does NOT push trig_mode/exposure/gain
    # via v4l2-ctl -- the AR0234 cameras run in their dtbo-locked free-run
    # mode at 60 fps. This trades sub-microsecond PWM-edge alignment for a
    # bring-up path that doesn't need root / PWM wiring / sudoers tweaks,
    # which is the right default for the GUI data-collection flow.
    #
    # To re-enable true PWM-edge slave sync on a rig where the SG16A
    # trigger input is wired and the host has passwordless sudo for
    # `sh pwm.sh` / `v4l2-ctl`:
    #   * flip `enabled: true`
    #   * keep `sensor_trig_mode: 1` (PWM-edge locked)
    #   * make sure `exposure_us` fits inside one PWM period -- the
    #     recorder auto-clamps to 0.85 * (1e6 / fps) and warns if not.
    # In slave mode at 60 Hz (period = 16666 us) keep `exposure_us` <= ~14000.
    enabled: true
    sdk_dir: tools/thor/gmsl2/sdk    # repo-relative; vendored pwm.sh lives here
    setup_script: pwm.sh        # relative to sdk_dir, or absolute path
    fps: 60                     # PWM frequency in Hz (only used when enabled)
    sensor_trig_mode: 1         # 0 = free_run (default), 1 = slave (PWM-edge locked)
    trig_pin: 0x00020007        # written to each camera via v4l2-ctl when enabled
    # Informational only -- recorded in episode meta.json.
    pwm_chip: pwmchip6 # vendor's suggested default; confirm with `ls /sys/class/pwm` and `tools/thor/gmsl2/sdk/pwm.sh --status`
    pwm_id: 0

# BOX 采集板 SDK over UDP. See `tools/thor/box_sdk/README.md` for the install
# steps (apt + setup_env.sh + pip install the wheel). UDP ports are pinned
# to 15000 in both directions per the vendor docs (`需求整理 §5.1`).
#
# `expected_devices` is the full set the gateway will surface on the
# frontend; `BoxClient.detect()` then trims it to whichever subset is
# actually publishing (a rig may have zero, one, or two Paxini touch pads
# attached). Set `enabled: false` for camera-only sessions.
box_collection:
  enabled: true
  bind_ip: "192.168.2.45"
  bind_port: 15000
  remote_ip: "192.168.2.60"
  remote_port: 15000
  sdk_dir: tools/thor/box_sdk
  sdk_setup_script: setup_env.sh
  urdf_relpath: share/monte_gripper.urdf
  startup_mode: 0          # 0 = collection (trigger-controlled), 1 = control
  poll_interval_s: 0.002   # 500 Hz; MCU timestamp dedup reveals each sensor's native rate
  record_poll_interval_s: 0.002  # same as poll; kept separate for configs that want lower idle CPU
  stale_threshold_s: 1.0   # consider a sensor offline after this gap
  expected_devices:
    - box_gripper
    - box_imu
    - box_trigger
    - box_six_d_force
    - box_touch_left
    - box_touch_right

dataset:
  repo_id: local/thor_gmsl2_11ch_v1
  single_task: Thor GMSL2 11-camera capture
  root: outputs/datasets/thor_gmsl2_11ch_v1
  # The orchestrator writes one MKV per camera per episode plus
  # `episode_<idx>/meta.json` describing the cameras, codecs, wallclock
  # timestamps, and hardware-sync settings. There is no LeRobotDataset
  # parquet (the GUI consumer reads the MKV streams + meta.json directly).
  fps: 60
  num_episodes: 0              # 0 = unlimited; press the GUI's Save/Stop
  episode_time_s: 10
  push_to_hub: false

display_data: true
play_sounds: false
resume: false
