      ["p50", f2(d.summary.p50) + " mm"], ["p95", f2(d.summary.p95) + " mm"],
      ["RMSE", f2(d.summary.rmse) + " mm"], ["max", f2(d.summary.max) + " mm"],
      ["静止 p95", f2(d.strata.speed_rest.p95) + " mm"], ["快档 p50", f2(d.strata.speed_fast.p50) + " mm"],
    ],
    notes: `<p class="note"><b>比较的点：</b>相机 TCP − 跟踪仪 TCP。跟踪仪 TCP = SMR + R·(SMR→TCP)，SMR→TCP 来自 09-28 pivot；生产 c<sub>TCP</sub> 的常量误差包含在内，只有球窝→TCP 偏距 d 看不见。</p>
      <p class="note"><b>Δt：</b>−5 ms 是扫出来的最优（曝光中点在 SOF 前约 5 ms），<span class="warnnote">生产录制器仍用 0</span>。切换可看到误差随速度的变化。</p>
      <p class="note">数据：<span class="mono">thor_gmsl2_9ch_v1_20260928_154725</span> ep0，跟踪仪会话 <span class="mono">lt_20260928_074728</span>，旧 pivot 插件（09-28 常量）。</p>`,
    errLabel: "TCP 误差 (mm)",
  };
}

function pivotModel() {
  const d = DATA.pivot;
  const n = d.t.length;
  const errTcp = d.cam_tcp.map((p) => norm3(p, d.socket));
  const errSmr = d.cam_smr.map((p, i) => norm3(p, d.trk_smr[i]));
  const seatedIdx = d.seated.map((s, i) => (s ? i : -1)).filter((i) => i >= 0);
  const se = seatedIdx.map((i) => errSmr[i]), te = seatedIdx.map((i) => errTcp[i]);
  return {
    n, t: d.t,
    a: { name: "跟踪仪 SMR", pts: d.trk_smr },
    b: { name: "相机 SMR", pts: d.cam_smr },
    err: errSmr, errTcp,
    seated: d.seated,
    sphereRes: d.sphere_res,
    stats: [
      ["SMR p50", f2(pct(se, 0.5)) + " mm"], ["SMR p95", f2(pct(se, 0.95)) + " mm"],
      ["TCP→球窝 p50", f2(pct(te, 0.5)) + " mm"], ["TCP→球窝 p95", f2(pct(te, 0.95)) + " mm"],
      ["落座帧", seatedIdx.length + " / " + n], ["球面半径", f2(d.radius_mm) + " mm"],
    ],
    notes: `<p class="note"><b>两组点：</b>① SMR 轨迹：跟踪仪实测 vs 相机位姿 × 钢片 SMR 常量；② 相机 TCP 点云（蓝色小点）应落在跟踪仪球窝中心（黑色菱形）上。</p>
      <p class="note warnnote">这两项都是<b>自洽检查</b>，不是独立验证：SMR 常量取自本段落座帧的平均，TCP 常量（bundle 0929）也来自这一段，所以常量误差为 0，剩下的是随姿态变化的部分。独立的 TCP 轨迹误差要用插件 v2 另录一段自由运动。</p>
      <p class="note">灰色为未落座帧（开头 0–8 s 与 28 s 抖动），拟合时已剔除。数据：<span class="mono">tm_20260929_144634</span> ep2，会话 <span class="mono">lt_20260929_064632</span>。</p>`,
    errLabel: "SMR 误差 (mm)",
  };
}

const model = () => (state.ds === "free" ? freeModel() : pivotModel());

// ---------- 3D ----------
function sphereMesh(c, r) {
  const xs = [], ys = [], zs = [];
  const nu = 36, nv = 18;
  for (let i = 0; i <= nv; i++) {
    const v = Math.PI * i / nv, rx = [], ry = [], rz = [];
    for (let j = 0; j <= nu; j++) {
      const u = 2 * Math.PI * j / nu;
      rx.push(c[0] + r * Math.sin(v) * Math.cos(u));
      ry.push(c[1] + r * Math.sin(v) * Math.sin(u));
      rz.push(c[2] + r * Math.cos(v));
    }
    xs.push(rx); ys.push(ry); zs.push(rz);
  }
  return { xs, ys, zs };
}

function render3d() {
  const m = model();
  const upto = Math.max(1, Math.round(state.frac * (m.n - 1)) + 1);
  const idx = [...Array(upto).keys()];
  const showUnseated = $("showUnseated").checked;
  const keep = m.seated ? idx.filter((i) => m.seated[i] || showUnseated) : idx;
  const exag = $("exaggerate").checked ? 20 : 1;
  const bPts = m.b.pts.map((p, i) => exag === 1 ? p : p.map((v, k) => m.a.pts[i][k] + (v - m.a.pts[i][k]) * exag));
  const traces = [];
  const ink = css("--ink"), grid = css("--grid"), muted = css("--muted");

  // tracker (a): line, seated solid
  const lineOf = (pts, sel) => ({ x: sel.map((i) => pts[i][0]), y: sel.map((i) => pts[i][1]), z: sel.map((i) => pts[i][2]) });
  const splitSeated = (sel) => {
    if (!m.seated) return [sel, []];
    return [sel.map((i) => (m.seated[i] ? i : null)), showUnseated ? sel.map((i) => (!m.seated[i] ? i : null)) : []];
  };
  const withGaps = (pts, sel) => ({
    x: sel.map((i) => (i === null ? null : pts[i][0])),
    y: sel.map((i) => (i === null ? null : pts[i][1])),
    z: sel.map((i) => (i === null ? null : pts[i][2])),
  });
  const [aSeat, aUn] = splitSeated(idx);
  traces.push({ type: "scatter3d", mode: "lines", name: m.a.name, ...withGaps(m.a.pts, aSeat),
    line: { color: css("--trk"), width: 5 }, connectgaps: false, hoverinfo: "skip" });
  if (aUn.length) traces.push({ type: "scatter3d", mode: "lines", name: m.a.name + "（未落座）", ...withGaps(m.a.pts, aUn),
    line: { color: css("--dim"), width: 3 }, connectgaps: false, hoverinfo: "skip", showlegend: false });

  // camera (b)
  const colorRes = $("colorRes").checked;
  const [bSeat, bUn] = splitSeated(idx);
  const bLine = withGaps(bPts, bSeat);
  traces.push({ type: "scatter3d", mode: colorRes ? "lines+markers" : "lines", name: m.b.name, ...bLine,
    connectgaps: false,
    line: { color: css("--cam"), width: colorRes ? 2 : 4 },
    marker: colorRes ? { size: 2.6, color: bSeat.map((i) => (i === null ? 0 : m.err[i])), colorscale: "Viridis", cmin: 0, cmax: state.ds === "free" ? 4 : 2,
      colorbar: { title: { text: "mm", font: { color: muted } }, thickness: 10, len: 0.5, x: 1.0, tickfont: { color: muted } } } : undefined,
    text: bSeat.map((i) => (i === null ? "" : `t ${m.t[i].toFixed(2)} s<br>误差 ${m.err[i].toFixed(2)} mm`)),
    hovertemplate: "%{text}<extra>" + m.b.name + "</extra>" });
  if (bUn.length) traces.push({ type: "scatter3d", mode: "lines", name: m.b.name + "（未落座）", ...withGaps(bPts, bUn),
    line: { color: css("--dim"), width: 2 }, connectgaps: false, hoverinfo: "skip", showlegend: false });

  // connectors
  if ($("showConn").checked) {
    const step = Number($("connStep").textContent);
    const cx = [], cy = [], cz = [];
    for (const i of keep) {
      if (i % step) continue;
      cx.push(m.a.pts[i][0], bPts[i][0], null);
      cy.push(m.a.pts[i][1], bPts[i][1], null);
      cz.push(m.a.pts[i][2], bPts[i][2], null);
    }
    traces.push({ type: "scatter3d", mode: "lines", name: "配对连线", x: cx, y: cy, z: cz,
      line: { color: css("--conn"), width: 2 }, hoverinfo: "skip" });
  }

  // current markers
  const cur = upto - 1;
  traces.push({ type: "scatter3d", mode: "markers", name: "当前帧", showlegend: false,
    x: [m.a.pts[cur][0], bPts[cur][0]], y: [m.a.pts[cur][1], bPts[cur][1]], z: [m.a.pts[cur][2], bPts[cur][2]],
    marker: { size: 6, color: [css("--trk"), css("--cam")], line: { color: ink, width: 1 } }, hoverinfo: "skip" });

  if (state.ds === "pivot") {
    const d = DATA.pivot;
    const tk = keep.filter((i) => d.seated[i]);
    traces.push({ type: "scatter3d", mode: "markers", name: "相机 TCP（落座帧）",
      x: tk.map((i) => d.cam_tcp[i][0]), y: tk.map((i) => d.cam_tcp[i][1]), z: tk.map((i) => d.cam_tcp[i][2]),
      marker: { size: 1.8, color: css("--cam"), opacity: 0.55 },
      text: tk.map((i) => `t ${d.t[i].toFixed(2)} s<br>距球窝 ${m.errTcp[i].toFixed(2)} mm`), hovertemplate: "%{text}<extra>相机 TCP</extra>" });
    traces.push({ type: "scatter3d", mode: "markers", name: "跟踪仪球窝中心",
      x: [d.socket[0]], y: [d.socket[1]], z: [d.socket[2]],
      marker: { size: 7, symbol: "diamond", color: css("--sock") }, hovertemplate: "球窝中心<extra></extra>" });
    if ($("showSphere").checked) {
      const s = sphereMesh(d.socket, d.radius_mm);
      traces.push({ type: "surface", x: s.xs, y: s.ys, z: s.zs, showscale: false, opacity: 0.06,
        colorscale: [[0, css("--trk")], [1, css("--trk")]], hoverinfo: "skip", name: "拟合球面", showlegend: true });
    }
  }

  const axis = (t) => ({ title: { text: t, font: { color: muted } }, gridcolor: grid, zerolinecolor: grid,
    color: muted, backgroundcolor: "rgba(0,0,0,0)", showbackground: false });
  const layout = {
    uirevision: state.ds,
    paper_bgcolor: "rgba(0,0,0,0)", plot_bgcolor: "rgba(0,0,0,0)",
    margin: { l: 0, r: 0, t: 4, b: 0 },
    showlegend: true, legend: { font: { color: ink, size: 12 }, x: 0, y: 1, bgcolor: "rgba(0,0,0,0)" },
    scene: { aspectmode: "data", xaxis: axis("x (mm)"), yaxis: axis("y (mm)"), zaxis: axis("z (mm)") },
    font: { color: ink },
  };
  Plotly.react("plot3d", traces, layout, { responsive: true, displaylogo: false });
}

// ---------- 2D ----------
function render2d() {
  const m = model();
  const ink = css("--ink"), grid = css("--grid"), muted = css("--muted");
  const cur = m.t[Math.max(0, Math.round(state.frac * (m.n - 1)))];
  const traces = [];
  if (state.ds === "free") {
    for (const [k, c, w] of [["0", css("--conn"), 1.2], ["-5", css("--cam"), 1.6]]) {
      const d = DATA.free[k];
      traces.push({ type: "scatter", mode: "lines", x: d.t, y: d.res, name: "Δt " + (k === "0" ? "0" : "−5") + " ms", line: { color: c, width: w } });
    }
    traces.push({ type: "scatter", mode: "lines", x: DATA.free["-5"].t, y: DATA.free["-5"].v.map((v) => v * 1000 / 100), name: "速度 /100 (mm/s)",
      line: { color: css("--trk"), width: 1, dash: "dot" }, yaxis: "y" });
  } else {
    const d = DATA.pivot;
    traces.push({ type: "scatter", mode: "lines", x: d.t, y: m.err.map((e, i) => (d.seated[i] ? e : null)), name: "SMR 误差", line: { color: css("--cam"), width: 1.4 } });
    traces.push({ type: "scatter", mode: "lines", x: d.t, y: m.errTcp.map((e, i) => (d.seated[i] ? e : null)), name: "相机 TCP→球窝", line: { color: css("--accent"), width: 1.2 } });
    traces.push({ type: "scatter", mode: "lines", x: d.t, y: d.sphere_res.map((r) => r * 5), name: "球面径向残差 ×5", line: { color: css("--trk"), width: 1, dash: "dot" } });
  }
  const layout = {
    paper_bgcolor: "rgba(0,0,0,0)", plot_bgcolor: "rgba(0,0,0,0)",
    margin: { l: 44, r: 8, t: 8, b: 34 }, font: { color: ink, size: 12 },
    xaxis: { title: { text: "t (s)", font: { color: muted } }, gridcolor: grid, zerolinecolor: grid, color: muted },
    yaxis: { title: { text: "mm", font: { color: muted } }, gridcolor: grid, zerolinecolor: grid, color: muted },
    legend: { orientation: "h", y: 1.18, font: { size: 11 } },
    shapes: [{ type: "line", x0: cur, x1: cur, yref: "paper", y0: 0, y1: 1, line: { color: muted, width: 1, dash: "dash" } }],
  };
  Plotly.react("plot2d", traces, layout, { responsive: true, displaylogo: false, displayModeBar: false });
}

function renderSide() {
  const m = model();
  $("stats").innerHTML = m.stats.map(([k, v]) => `<div class="stat"><div class="k">${k}</div><div class="v">${v}</div></div>`).join("");
  $("notes").innerHTML = m.notes;
  $("legend").innerHTML = `<span><span class="sw" style="background:var(--trk)"></span>${m.a.name}</span><span><span class="sw" style="background:var(--cam)"></span>${m.b.name}</span>`;
  $("dtRow").style.display = state.ds === "free" ? "" : "none";
  $("sphereRow").style.display = state.ds === "pivot" ? "" : "none";
  $("unseatRow").style.display = state.ds === "pivot" ? "" : "none";
  $("connStep").textContent = state.ds === "free" ? "10" : "15";
  const cur = Math.round(state.frac * (m.n - 1));
  $("tLabel").textContent = `${m.t[cur].toFixed(2)} / ${m.t[m.n - 1].toFixed(2)} s`;
}

function renderAll() { renderSide(); render3d(); render2d(); }

// ---------- wiring ----------
function buildTabs() {
  $("tabs").innerHTML = DATASETS.map((d) =>
    `<button class="tab" role="tab" data-ds="${d.id}" aria-selected="${d.id === state.ds}">${d.title}<small>${d.sub}</small></button>`).join("");
  document.querySelectorAll(".tab").forEach((b) => b.addEventListener("click", () => {
    state.ds = b.dataset.ds; state.frac = 1; $("tSlider").value = 100; stop();
    document.querySelectorAll(".tab").forEach((x) => x.setAttribute("aria-selected", x === b));
    history.replaceState(null, "", "#" + state.ds);
    try { localStorage.setItem("traj3d.ds", state.ds); } catch (e) {}
    renderAll();
  }));
}
document.querySelectorAll("#dtSeg button").forEach((b) => b.addEventListener("click", () => {
  state.dt = b.dataset.dt;
  document.querySelectorAll("#dtSeg button").forEach((x) => x.setAttribute("aria-pressed", x === b));
  renderAll();
}));
["colorRes", "showConn", "showSphere", "showUnseated", "exaggerate"].forEach((id) => $(id).addEventListener("change", render3d));

let raf = null, lastTs = 0;
$("tSlider").addEventListener("input", (e) => { state.frac = e.target.value / 100; renderSide(); render3d(); render2d(); });
function stop() { state.playing = false; $("playBtn").textContent = "▶ 播放"; if (raf) cancelAnimationFrame(raf); raf = null; }
function tick(ts) {
  if (!state.playing) return;
  if (ts - lastTs > 90) {
    lastTs = ts;
    state.frac = Math.min(1, state.frac + 0.01);
    $("tSlider").value = Math.round(state.frac * 100);
    renderSide(); render3d(); render2d();
    if (state.frac >= 1) { stop(); return; }
  }
  raf = requestAnimationFrame(tick);
}
$("playBtn").addEventListener("click", () => {
  if (state.playing) { stop(); return; }
  if (state.frac >= 1) state.frac = 0;
  state.playing = true; $("playBtn").textContent = "❚❚ 暂停"; raf = requestAnimationFrame(tick);
});

$("themeBtn").addEventListener("click", () => {
  const root = document.documentElement;
  const dark = root.dataset.theme ? root.dataset.theme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
  root.dataset.theme = dark ? "light" : "dark";
  renderAll();
});
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", renderAll);

try { const s = localStorage.getItem("traj3d.ds"); if (s === "free" || s === "pivot") state.ds = s; } catch (e) {}
if (location.hash === "#pivot" || location.hash === "#free") state.ds = location.hash.slice(1);
buildTabs();
renderAll();
</script>
</body>
</html>
